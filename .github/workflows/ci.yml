name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  architecture-and-backend:
    name: Architecture & Backend Quality Gate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: eaimos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: '2.2.1'
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install Dependencies
        working-directory: ./apps/api
        run: poetry install --no-interaction

      - name: Architecture Fitness Gate
        working-directory: ./apps/api
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/eaimos_test
          SECRET_KEY: test_secret_key_minimum_32_characters_long_12345
          ENVIRONMENT: test
        run: poetry run pytest tests/test_architecture_fitness.py -v

      - name: Backend Test Suite (668 Tests)
        working-directory: ./apps/api
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/eaimos_test
          SECRET_KEY: test_secret_key_minimum_32_characters_long_12345
          ENVIRONMENT: test
        run: poetry run pytest tests/ -v

      - name: Alembic Migration Head Check
        working-directory: ./apps/api
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/eaimos_test
          SECRET_KEY: test_secret_key_minimum_32_characters_long_12345
          ENVIRONMENT: test
        run: poetry run alembic heads

  frontend:
    name: Frontend Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: TypeScript Typecheck
        run: npm run typecheck

      - name: Production Web Build
        run: npm run web:build

  docker:
    name: Docker Stack & Browser E2E Gate
    runs-on: ubuntu-latest
    needs: [architecture-and-backend, frontend]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose Config
        run: |
          cp .env.example .env
          docker compose config

      - name: Build Docker Stack
        run: docker compose build

      - name: Start Docker Stack
        run: docker compose up -d

      - name: Verify Service Health & Readiness
        run: |
          echo "Waiting for core services to report healthy..."
          timeout 120s bash -c 'until docker compose ps | grep "(healthy)"; do sleep 2; done'
          
          echo "Verifying API health endpoint..."
          curl -f http://localhost:8000/health || exit 1
          
          echo "Verifying API liveness endpoint..."
          curl -f http://localhost:8000/live || exit 1
          
          echo "Verifying API readiness endpoint..."
          curl -f http://localhost:8000/ready || exit 1
          
          echo "Verifying Frontend availability..."
          curl -f http://localhost:3000 || exit 1
          
          echo "Verifying Nginx reverse proxy..."
          curl -f http://localhost:80 || exit 1

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Execute Browser E2E Test Suite
        run: npm run test:e2e
        env:
          PLAYWRIGHT_TEST_BASE_URL: http://localhost:3000

      - name: Upload E2E Test Reports & Artifacts on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-report
          path: playwright-report/
          retention-days: 14

      - name: Teardown Docker Stack
        if: always()
        run: docker compose down -v
