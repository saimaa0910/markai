name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-gate:
    name: Architecture & Backend Quality Gate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: eaimos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: '2.2.1'
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache Poetry Virtualenv
        uses: actions/cache@v4
        with:
          path: apps/api/.venv
          key: poetry-${{ runner.os }}-${{ hashFiles('apps/api/poetry.lock') }}
          restore-keys: |
            poetry-${{ runner.os }}-

      - name: Install Backend Dependencies
        working-directory: ./apps/api
        run: poetry install --no-interaction

      - name: Architecture Fitness Gate
        working-directory: ./apps/api
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/eaimos_test
          SECRET_KEY: test_secret_key_minimum_32_characters_long_12345
          ENVIRONMENT: test
        run: poetry run pytest tests/test_architecture_fitness.py -v

      - name: Database Migration Gate
        working-directory: ./apps/api
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/eaimos_test
          SECRET_KEY: test_secret_key_minimum_32_characters_long_12345
          ENVIRONMENT: test
        run: |
          echo "=== 1. Verify Single Migration Head ==="
          poetry run alembic heads
          echo "=== 2. Apply Migrations to Fresh Database ==="
          poetry run alembic upgrade head
          echo "=== 3. Verify Database Revision Matches Head ==="
          poetry run alembic current

      - name: Backend Test Suite
        working-directory: ./apps/api
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/eaimos_test
          SECRET_KEY: test_secret_key_minimum_32_characters_long_12345
          ENVIRONMENT: test
        run: poetry run pytest tests/ -v

  frontend-gate:
    name: Frontend Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci --legacy-peer-deps

      - name: TypeScript Typecheck Gate
        run: npm run typecheck

      - name: Frontend Production Build Gate
        run: npm run web:build

  docker-gate:
    name: Docker Build & Runtime Smoke Test
    runs-on: ubuntu-latest
    needs: [backend-gate, frontend-gate]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose Specification
        run: docker compose config

      - name: Build Docker Stack
        run: docker compose build

      - name: Start Docker Stack
        run: docker compose up -d

      - name: Verify Service Health & Readiness
        run: |
          echo "Waiting for core services to report healthy..."
          timeout 120s bash -c 'until docker compose ps | grep "(healthy)"; do sleep 2; done'
          
          echo "Verifying API health endpoint..."
          curl -f http://localhost:8000/health || exit 1
          
          echo "Verifying API liveness endpoint..."
          curl -f http://localhost:8000/live || exit 1
          
          echo "Verifying API readiness endpoint..."
          curl -f http://localhost:8000/ready || exit 1
          
          echo "Verifying Frontend availability..."
          curl -f http://localhost:3000 || exit 1
          
          echo "Verifying Nginx reverse proxy..."
          curl -f http://localhost:80 || exit 1

      - name: Teardown Docker Stack
        if: always()
        run: docker compose down -v
