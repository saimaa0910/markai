name: CD — Staging Continuous Delivery

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: cd-staging
  cancel-in-progress: false

jobs:
  build-and-deploy-staging:
    name: Build Immutable Artifacts & Deploy Staging
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.viptant.com
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Tag Staging API Image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/api
          file: ./infra/docker/api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/api:${{ github.sha }}
            ghcr.io/${{ github.repository }}/api:staging-latest

      - name: Build & Tag Staging Web Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./infra/docker/web/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/web:${{ github.sha }}
            ghcr.io/${{ github.repository }}/web:staging-latest

      - name: Execute Staging Database Migrations
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          SECRET_KEY: ${{ secrets.STAGING_SECRET_KEY }}
        run: |
          echo "Applying pending database migrations to Staging environment..."
          # Deployer executes migrations against staging DB
          # docker run --rm -e DATABASE_URL=${DATABASE_URL} -e SECRET_KEY=${SECRET_KEY} ghcr.io/${{ github.repository }}/api:${{ github.sha }} alembic upgrade head

      - name: Verify Staging Health & Readiness
        run: |
          echo "Verifying Staging Deployment Health..."
          echo "Commit SHA: ${{ github.sha }}"
          echo "Deployment Timestamp: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
