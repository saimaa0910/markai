name: Viptant Monorepo CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-lint-test:
    name: Backend Lint & Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 2.2.1
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install Backend Dependencies
        run: |
          cd apps/api
          poetry install --no-interaction --no-root

      - name: Run Code Linters
        run: |
          cd apps/api
          poetry run black --check src/
          poetry run flake8 src/

      - name: Run Pytest Test Cases
        run: |
          cd apps/api
          poetry run pytest tests/ --cov=api --cov-report=xml

      - name: Upload Test Coverage
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage
          path: apps/api/coverage.xml

  frontend-lint-build:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Monorepo Dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint Next.js App
        run: npm run lint

      - name: Compile and Build Web Bundle
        run: npm run web:build

  docker-build-check:
    name: Docker Integration Builds
    runs-on: ubuntu-latest
    needs: [backend-lint-test, frontend-lint-build]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/api
          file: ./infra/docker/api/Dockerfile
          push: false
          tags: viptant-api:latest

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./infra/docker/web/Dockerfile
          push: false
          tags: viptant-web:latest
