[project]
name = "api"
version = "0.1.0"
description = "FastAPI Backend API for EAIMOS"
authors = [
    {name = "saimaa0910", email = "tmami.0910@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13,<4.0"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn>=0.30.1",
    "pydantic[email]>=2.7.4",
    "sqlalchemy>=2.0.31",
    "alembic>=1.13.1",
    "psycopg2-binary>=2.9.9",
    "redis>=5.0.6",
    "boto3>=1.34.127",
    "minio>=7.2.7",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.9",
    "bcrypt>=4.1.0",
    "pyotp>=2.9.0",
    "qrcode[pil]>=8.2.0",
    "pydantic-settings>=2.3.3",
    "pgvector (>=0.5.0,<0.6.0)",
    "tiktoken (>=0.13.0,<0.14.0)",
    "structlog (>=26.1.0,<27.0.0)",
    "httpx>=0.27.0",
    "celery>=5.4.0",
    "opentelemetry-api (>=1.43.0,<2.0.0)",
    "opentelemetry-sdk (>=1.43.0,<2.0.0)",
    "opentelemetry-instrumentation-fastapi (>=0.64b0,<0.65)",
    "opentelemetry-instrumentation-sqlalchemy (>=0.64b0,<0.65)",
    "opentelemetry-instrumentation-redis (>=0.64b0,<0.65)",
    "opentelemetry-exporter-otlp (>=1.43.0,<2.0.0)",
    "prometheus-client (>=0.25.0,<0.26.0)",
    "beautifulsoup4 (>=4.15.0,<5.0.0)"
]

[tool.poetry]
packages = [{include = "api", from = "src"}]

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.2"
pytest-cov = "^5.0.0"
black = "^24.4.2"
flake8 = "^7.1.0"
mypy = "^1.10.0"
pytest-asyncio = "^1.4.0"
pytest-xdist = "^3.8.0"

[tool.black]
line-length = 88
target-version = ['py313']
include = '\.pyi?$'

[tool.mypy]
strict = false
ignore_missing_imports = true
check_untyped_defs = false
disallow_untyped_defs = false
disallow_any_generics = false
warn_return_any = false
ignore_errors = true
exclude = ["alembic"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
